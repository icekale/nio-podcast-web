version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '00:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
