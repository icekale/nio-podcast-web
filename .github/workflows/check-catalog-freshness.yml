name: Check catalog freshness

on:
  schedule:
    - cron: '0 6 * * *' # Beijing 14:00 daily
  workflow_dispatch:

permissions:
  actions: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Measure catalog update age
        id: age
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPDATED_AT=$(gh run list --workflow update-catalog.yml --status completed --limit 20 --json conclusion,updatedAt --jq 'map(select(.conclusion == "success"))[0].updatedAt // empty' 2>/dev/null || true)
          UPDATED_MS=0
          if [ -n "$UPDATED_AT" ]; then UPDATED_MS=$(date -d "$UPDATED_AT" +%s%3N); fi
          NOW=$(date +%s%3N)
          AGE_HOURS=$(( (NOW - UPDATED_MS) / 3600000 ))
          if [ "$AGE_HOURS" -lt 0 ]; then AGE_HOURS=0; fi
          echo "updated_at=$UPDATED_AT age_hours=$AGE_HOURS"
          echo "updated_at=$UPDATED_AT" >> "$GITHUB_OUTPUT"
          echo "age_hours=$AGE_HOURS" >> "$GITHUB_OUTPUT"

      - name: Auto-repair stale catalog
        if: ${{ fromJson(steps.age.outputs.age_hours) > 26 }}
        run: gh workflow run update-catalog.yml -f mode=incremental
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Escalate if still stale
        if: ${{ fromJson(steps.age.outputs.age_hours) > 50 }}
        run: |
          EXISTING=$(gh issue list --state open --search "目录已过期" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "目录已过期 50+ 小时,需要人工检查" \
              --body "最近一次成功的 update-catalog 运行时间为 ${{ steps.age.outputs.updated_at }}(约 ${{ steps.age.outputs.age_hours }} 小时前)。已自动触发一次增量更新修复,请检查工作流运行状态与 NIO 上游是否正常。"
          else
            echo "已有 open issue #$EXISTING,跳过创建"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
